InpaintModeDesc = STTN (умное удаление): быстро обрабатывает видео с людьми, минимум 4 ГБ видеопамяти
    STTN (с поиском субтитров): определяет наличие текста, без умного восстановления, минимум 4 ГБ видеопамяти
    LaMa: подходит для анимации, средняя скорость, небольшие требования к видеопамяти
    ProPainter: подходит для динамичных сцен, работает медленно, минимум 8 ГБ видеопамяти
    OpenCV: очень быстрый метод, качество восстановления не гарантируется, удаляет текст только в обнаруженных областях
