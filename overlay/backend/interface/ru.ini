SubtitleYXAxisDifferencePixelDesc = Отсекает области, не похожие на субтитры (по умолчанию 10 пикселей). Если высота рамки слишком сильно превышает её ширину, распознавание считается ошибочным.
SubtitleAreaDeviationPixel = Отступ от границ текста
SubtitleAreaDeviationPixelDesc = Расширяет маску, чтобы после удаления не оставались края символов (по умолчанию 10 пикселей).
SubtitleAreaYAxisDifferencePixel = Допуск высоты строк субтитров
SubtitleAreaYAxisDifferencePixelDesc = Максимальная разница высот текстовых рамок в одной строке (по умолчанию 20 пикселей).
SubtitleAreaPixelToleranceYPixel = Допуск по вертикали
SubtitleAreaPixelToleranceYPixelDesc = Допустимое смещение рамок текста по оси Y при сопоставлении (по умолчанию 20 пикселей).
SubtitleAreaPixelToleranceXPixel = Допуск по горизонтали
SubtitleAreaPixelToleranceXPixelDesc = Допустимое смещение рамок текста по оси X при сопоставлении (по умолчанию 20 пикселей).
SubtitleTimelineBackwardFrameCount = Кадры до появления субтитра
SubtitleTimelineBackwardFrameCountDesc = Добавляет кадры перед обнаруженным субтитром, чтобы убрать плавное появление текста (по умолчанию 3).
subtitleTimelineForwardFrameCount = Кадры после исчезновения субтитра
subtitleTimelineForwardFrameCountDesc = Добавляет кадры после обнаруженного субтитра, чтобы убрать плавное исчезновение текста (по умолчанию 3).
SttnNeighborStride = Шаг между опорными кадрами
SttnNeighborStrideDesc = По умолчанию 5
SttnReferenceLength = Количество опорных кадров
SttnReferenceLengthDesc = По умолчанию 10
SttnMaxLoadNum = Максимум кадров в одной обработке
SttnMaxLoadNumDesc = Большее значение может повысить качество, но требует больше видеопамяти (по умолчанию 50).
PropainterMaxLoadNum = Максимум кадров в одной обработке
PropainterMaxLoadNumDesc = Большее значение может повысить качество, но требует больше видеопамяти (по умолчанию 70).
